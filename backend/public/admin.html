<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MLBB Hero Upload - Admin Panel</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1a1a2e 50%, #16213e 100%);
            min-height: 100vh;
            padding: 20px;
            color: #e0e0e0;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: rgba(26, 26, 46, 0.95);
            border: 2px solid #00d4ff;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.3);
        }

        h1 {
            text-align: center;
            color: #00d4ff;
            margin-bottom: 30px;
            font-size: 28px;
            text-shadow: 0 0 10px rgba(0, 212, 255, 0.5);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #00d4ff;
        }

        select, input[type="file"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #00d4ff;
            border-radius: 6px;
            background: rgba(0, 212, 255, 0.05);
            color: #e0e0e0;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
        }

        select:focus, input[type="file"]:focus {
            outline: none;
            background: rgba(0, 212, 255, 0.1);
            box-shadow: 0 0 10px rgba(0, 212, 255, 0.3);
        }

        .file-input-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
            width: 100%;
        }

        .upload-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .upload-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 20px rgba(102, 126, 234, 0.5);
        }

        .upload-btn:active {
            transform: translateY(0);
        }

        .message {
            margin-top: 20px;
            padding: 15px;
            border-radius: 6px;
            text-align: center;
            font-weight: bold;
            display: none;
        }

        .message.success {
            background: rgba(76, 175, 80, 0.2);
            color: #4caf50;
            border: 2px solid #4caf50;
        }

        .message.error {
            background: rgba(244, 67, 54, 0.2);
            color: #f44336;
            border: 2px solid #f44336;
        }

        .preview {
            margin-top: 20px;
            text-align: center;
        }

        .preview img {
            max-width: 100%;
            max-height: 300px;
            border-radius: 8px;
            border: 2px solid #00d4ff;
            display: none;
        }

        .hero-info {
            margin-top: 15px;
            padding: 12px;
            background: rgba(0, 212, 255, 0.1);
            border-left: 4px solid #00d4ff;
            border-radius: 4px;
            font-size: 13px;
        }

        .hero-info strong {
            color: #00d4ff;
        }

        .loading {
            display: none;
            text-align: center;
            color: #00d4ff;
            margin-top: 10px;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎮 Hero Image Upload</h1>
        
        <form id="uploadForm">
            <div class="form-group">
                <label for="heroSelect">Select Hero:</label>
                <select id="heroSelect" required>
                    <option value="">-- Choose a Hero --</option>
                </select>
                <div class="hero-info" id="heroInfo" style="display: none;">
                    <strong>Role:</strong> <span id="heroRole"></span><br>
                    <strong>Difficulty:</strong> <span id="heroDifficulty"></span>
                </div>
            </div>

            <div class="form-group">
                <label for="imageFile">Upload Hero Image:</label>
                <small style="color: #00d4ff; display: block; margin-bottom: 8px;">Supported: JPG, PNG, WebP, GIF, SVG, BMP, ICO</small>
                <div class="file-input-wrapper">
                    <input type="file" id="imageFile" accept="image/*" required>
                </div>
                <div class="preview">
                    <img id="preview" alt="Preview">
                </div>
            </div>

            <button type="submit" class="upload-btn">Upload Image</button>
            <div class="loading" id="loading">Uploading...</div>
        </form>

        <div class="message" id="message"></div>
        <div class="message success" id="refreshMessage" style="display: none; margin-top: 20px;">
            ✅ Image uploaded! Refresh the Heroes page to see changes.
        </div>
    </div>

    <script>
        // Load heroes on page load
        async function loadHeroes() {
            try {
                const response = await fetch('/api/heroes');
                const heroes = await response.json();
                
                const select = document.getElementById('heroSelect');
                heroes.forEach(hero => {
                    const option = document.createElement('option');
                    option.value = hero.id;
                    option.textContent = `${hero.name} (${hero.role})`;
                    option.dataset.role = hero.role;
                    option.dataset.difficulty = hero.difficulty;
                    select.appendChild(option);
                });
            } catch (error) {
                showMessage('Error loading heroes: ' + error.message, 'error');
            }
        }

        // Show hero info when selected
        document.getElementById('heroSelect').addEventListener('change', function() {
            if (this.value) {
                const option = this.options[this.selectedIndex];
                document.getElementById('heroRole').textContent = option.dataset.role;
                document.getElementById('heroDifficulty').textContent = '⭐'.repeat(option.dataset.difficulty);
                document.getElementById('heroInfo').style.display = 'block';
            } else {
                document.getElementById('heroInfo').style.display = 'none';
            }
        });

        // Image preview
        document.getElementById('imageFile').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('preview').src = e.target.result;
                    document.getElementById('preview').style.display = 'block';
                };
                reader.readAsDataURL(file);
            }
        });

        // Form submission
        document.getElementById('uploadForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const heroId = document.getElementById('heroSelect').value;
            const imageFile = document.getElementById('imageFile').files[0];

            if (!heroId || !imageFile) {
                showMessage('Please select a hero and image', 'error');
                return;
            }

            const formData = new FormData();
            formData.append('heroId', heroId);
            formData.append('image', imageFile);

            document.getElementById('loading').style.display = 'block';

            try {
                const response = await fetch('/api/admin/upload-hero-image', {
                    method: 'POST',
                    body: formData
                });

                const result = await response.json();

                if (response.ok) {
                    showMessage('✅ Image uploaded successfully!', 'success');
                    // Show refresh message
                    document.getElementById('refreshMessage').style.display = 'block';
                    setTimeout(() => {
                        document.getElementById('refreshMessage').style.display = 'none';
                    }, 8000);
                    
                    document.getElementById('uploadForm').reset();
                    document.getElementById('preview').style.display = 'none';
                    document.getElementById('heroInfo').style.display = 'none';
                } else {
                    showMessage('Error: ' + result.message, 'error');
                }
            } catch (error) {
                showMessage('Upload failed: ' + error.message, 'error');
            } finally {
                document.getElementById('loading').style.display = 'none';
            }
        });

        function showMessage(text, type) {
            const msg = document.getElementById('message');
            msg.textContent = text;
            msg.className = 'message ' + type;
            msg.style.display = 'block';
            
            setTimeout(() => {
                msg.style.display = 'none';
            }, 5000);
        }

        // Load heroes on page load
        loadHeroes();
    </script>
</body>
</html>
