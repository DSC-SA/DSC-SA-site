<svg width="400" height="400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="diamond-shatter" x="0" y="0" width="100" height="100" patternUnits="userSpaceOnUse">
      <!-- Scattered diamond/shattered glass effect -->
      <polygon points="20,10 40,5 45,25 30,30" fill="#c0c0c0" opacity="0.4"/>
      <polygon points="50,15 70,8 75,30 55,35" fill="#e8e8e8" opacity="0.3"/>
      <polygon points="80,20 95,10 100,40 85,45" fill="#808080" opacity="0.35"/>
      
      <polygon points="10,50 30,40 38,65 20,70" fill="#d0d0d0" opacity="0.3"/>
      <polygon points="45,45 65,35 72,70 52,75" fill="#c0c0c0" opacity="0.4"/>
      <polygon points="75,50 95,38 100,75 80,85" fill="#a0a0a0" opacity="0.35"/>
      
      <polygon points="15,80 35,70 42,95 25,100" fill="#e8e8e8" opacity="0.25"/>
      <polygon points="50,75 70,65 78,100 60,100" fill="#d0d0d0" opacity="0.3"/>
      <polygon points="0,30 20,20 28,50 10,60" fill="#b0b0b0" opacity="0.3"/>
    </pattern>
  </defs>
  
  <rect width="400" height="400" fill="url(#diamond-shatter)"/>
</svg>